<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | UV</title>
  <style>
    /* Elimina márgenes y rellenos por defecto en todos los elementos */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Configura la página a pantalla completa sin barras de desplazamiento */
    body { width: 100vw; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; position: relative; }

    /* Imagen de fondo ajustada exactamente al 100% del ancho y alto (object-fit: fill evita que se recorte y desfase los botones) */
    .fondo { width: 100%; height: 100%; object-fit: fill; position: absolute; inset: 0; z-index: 0; pointer-events: none; }

    /* Clase base para posicionar campos y botones exactamente sobre la imagen */
    .abs { position: absolute; background: transparent; border: none; z-index: 2; }

    /* Muestra la manita al pasar sobre un botón interactivo */
    .btn { cursor: pointer; transition: background 0.18s, outline 0.18s; }

    /* Efecto de resaltado cuando el usuario pasa el mouse sobre un botón */
    .btn:hover { background: #ffffff20; outline: 2px solid #4388e8; }

    /* Estilo de las cajas de texto (Matrícula y Contraseña) con espacio a la izquierda para los iconos de sobre y candado */
    .campo {
      left: 35.94%; width: 29.53%; height: 6.49%; padding: 0 3.2% 0 3.6%;
      border: 1px solid transparent; border-radius: 12px; color: #123f91;
      font-size: clamp(12px, 1.15vw, 18px); outline: none;
    }

    /* Color del texto de ayuda (placeholder) dentro de los campos */
    .campo::placeholder { color: #2454a0; opacity: 1; }

    /* Borde azul cuando el usuario hace clic para escribir en un campo */
    .campo:focus { border-color: #2878d8; background: #ffffff20; }

    /* Posición vertical exacta del campo de matrícula */
    #matricula { top: 49.07%; }

    /* Posición vertical exacta del campo de contraseña (deja espacio a la derecha para el icono del ojo) */
    #contraseña { top: 57.31%; padding-right: 3.8%; }

    /* Botón del icono del ojo alineado exactamente dentro del extremo derecho del campo de contraseña */
    .ojo { top: 57.31%; left: 62.30%; width: 3.17%; height: 6.49%; border-radius: 0 12px 12px 0; z-index: 3; }

    /* Tamaño y bordes redondeados para los botones principales (Iniciar sesión y Registrarse) */
    .accion { left: 35.94%; width: 29.53%; height: 6.94%; border-radius: 35px; }

    /* Ubicación vertical exacta del botón azul "Iniciar sesión" */
    .entrar { top: 70.37%; }

    /* Ubicación vertical exacta del botón "Registrarse" */
    .registrar { left: 35.85%; top: 82.87%; width: 29.68%; }

    /* Ubicación exacta del enlace "¿Olvidaste tu contraseña?" */
    .recuperar { top: 65.30%; left: 53.80%; width: 11.70%; height: 2.50%; border-radius: 4px; }

    /* Texto para mostrar mensajes de estado o error en la parte inferior */
    .mensaje {
      top: 91%; left: 25%; width: 50%; text-align: center; color: #0645ad;
      font-size: clamp(12px, 1vw, 16px); font-weight: bold;
    }

    /* Fondo oscuro semitransparente de la ventana emergente (modal) de autorización de tutor */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
      z-index: 100; justify-content: center; align-items: center; padding: 20px;
    }

    /* Caja blanca central de la ventana emergente */
    .modal-caja {
      background: white; width: 100%; max-width: 390px; padding: 30px 25px;
      border-radius: 18px; text-align: center; box-shadow: 0 10px 35px rgba(0,0,0,.3);
    }
    .modal-caja h2 { color: #123f91; margin: 10px 0; font-size: 22px; }
    .modal-caja p { color: #555; font-size: 14px; margin-bottom: 20px; }

    /* Campo para introducir la clave privada del tutor */
    #claveTutor {
      width: 100%; padding: 13px; border: 1px solid #cbd5e1; border-radius: 9px;
      outline: none; font-size: 15px; margin-bottom: 12px;
    }

    /* Contenedor en fila para los botones de Cancelar y Verificar del modal */
    .botones-modal { display: flex; gap: 10px; }
    .botones-modal button { flex: 1; padding: 12px; border: none; border-radius: 9px; cursor: pointer; font-weight: bold; }
    #confirmarTutor { background: #0755b8; color: white; }
    #cancelarTutor { background: #e5e7eb; color: #333; }
    #mensajeTutor { font-size: 13px; min-height: 18px; margin-top: 12px; font-weight: bold; }

    /* Ajuste de fuente en pantallas móviles */
    @media(max-width: 700px) { .campo { font-size: 11px; } }
  </style>
</head>
<body>
<!-- Imagen de fondo del login -->
<img src="../imagenes/principales/iniciar-sesion.png" class="fondo" alt="Login UV">

<!-- Formulario de inicio de sesión superpuesto al diseño -->
<form id="formLogin">
  <!-- Campo para escribir la matrícula -->
  <input class="abs campo" id="matricula" placeholder="Matrícula" required>
  <!-- Campo para escribir la contraseña -->
  <input class="abs campo" id="contraseña" type="password" placeholder="Contraseña" required>
  <!-- Botón sobre el icono del ojo para mostrar/ocultar la contraseña -->
  <button class="abs btn ojo" type="button" id="verClave" aria-label="Mostrar u ocultar contraseña" title="Mostrar u ocultar contraseña"></button>
  <!-- Botón sobre "¿Olvidaste tu contraseña?" -->
  <a class="abs btn recuperar" id="btnRecuperar" href="registro.html" aria-label="Recuperar contraseña" title="¿Olvidaste tu contraseña?"></a>
  <!-- Botón principal sobre "Iniciar sesión" -->
  <button class="abs btn accion entrar" type="submit" aria-label="Iniciar sesión" title="Iniciar sesión"></button>
  <!-- Botón sobre "Registrarse" que lleva al formulario de registro -->
  <a class="abs btn accion registrar" href="registro.html" aria-label="Registrarse" title="Registrarse"></a>
</form>

<!-- Párrafo donde se muestran avisos de carga o errores -->
<p class="abs mensaje" id="mensaje"></p>

<!-- Ventana modal que pide contraseña extra cuando el usuario entra como Tutor -->
<div class="modal" id="modalTutor">
  <div class="modal-caja">
    <div style="font-size: 40px;">🔐</div>
    <h2>Autorización de tutor</h2>
    <p>Introduce la contraseña privada para entrar como tutor.</p>
    <input type="password" id="claveTutor" placeholder="Contraseña privada">
    <div class="botones-modal">
      <button type="button" id="cancelarTutor">Cancelar</button>
      <button type="button" id="confirmarTutor">Verificar</button>
    </div>
    <div id="mensajeTutor"></div>
  </div>
</div>

<script type="module">
  // Importa la conexión a la base de datos de Firebase y las funciones de consulta de Firestore
  import { db } from "../base de datos/firebase.js";
  import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

  // Recupera si el usuario eligió entrar como 'tutor' o 'estudiante'
  const tipoUsuario = sessionStorage.getItem("tipoUsuario");
  // Si no ha elegido rol, lo regresa a la pantalla de selección
  if (!tipoUsuario) window.location.replace("tutor-estudiante.html");

  // Referencias a los elementos del DOM
  const claveInput = document.getElementById("contraseña");
  const matriculaInput = document.getElementById("matricula");
  const msj = document.getElementById("mensaje");
  const modal = document.getElementById("modalTutor");
  const claveTutor = document.getElementById("claveTutor");
  const msjTutor = document.getElementById("mensajeTutor");

  // Función auxiliar para mostrar un mensaje en pantalla con el color indicado
  function ponerMensaje(texto, color) {
    msj.textContent = texto;
    msj.style.color = color;
  }

  // Evento del botón del ojo: alterna el tipo de input entre 'password' (oculto) y 'text' (visible)
  document.getElementById("verClave").onclick = function() {
    claveInput.type = claveInput.type === "password" ? "text" : "password";
  };

  // Evento del enlace "¿Olvidaste tu contraseña?"
  document.getElementById("btnRecuperar").onclick = function(e) {
    e.preventDefault(); // Evita que navegue a otra página
    ponerMensaje("Próximamente podrás recuperar tu contraseña.", "#0645ad");
  };

  // Evento para cerrar la ventana modal del tutor al presionar "Cancelar"
  document.getElementById("cancelarTutor").onclick = function() {
    modal.style.display = "none";
    claveTutor.value = "";
    ponerMensaje("Autorización cancelada.", "red");
  };

  // Función que abre el modal y verifica la contraseña privada ("123") para tutores
  function pedirClaveTutor(datosUsuario) {
    modal.style.display = "flex"; // Muestra el modal
    claveTutor.value = "";
    msjTutor.textContent = "";
    claveTutor.focus(); // Coloca el cursor en el campo de clave

    document.getElementById("confirmarTutor").onclick = function() {
      if (claveTutor.value === "123") {
        // Si la clave privada es correcta, guarda la sesión como tutor y redirige a su panel
        datosUsuario.tipoUsuario = "tutor";
        sessionStorage.setItem("usuarioUV", JSON.stringify(datosUsuario));
        msjTutor.style.color = "green";
        msjTutor.textContent = "¡Correcto! Entrando...";
        setTimeout(() => {
          window.location.href = "../perspectiva del tutor/pantalla_principal_tutor.html";
        }, 700);
      } else {
        // Si la clave privada es incorrecta, avisa al usuario
        msjTutor.style.color = "red";
        msjTutor.textContent = "Contraseña incorrecta.";
        claveTutor.value = "";
      }
    };
  }

  // Permite confirmar la clave del modal presionando la tecla Enter
  claveTutor.onkeydown = function(e) {
    if (e.key === "Enter") document.getElementById("confirmarTutor").click();
  };

  // Evento al enviar el formulario de inicio de sesión
  document.getElementById("formLogin").onsubmit = async function(e) {
    e.preventDefault(); // Evita que la página se recargue
    ponerMensaje("Verificando datos...", "#0645ad");
    try {
      // Busca en la colección "usuarios" de Firestore los documentos con la matrícula ingresada
      const consulta = query(collection(db, "usuarios"), where("matricula", "==", matriculaInput.value.trim()));
      const resultado = await getDocs(consulta);

      // Si no existe ningún usuario con esa matrícula, muestra error
      if (resultado.empty) {
        return ponerMensaje("Esa matrícula no está registrada.", "red");
      }

      // Verifica que la contraseña coincida con la guardada en la base de datos
      let usuarioEncontrado = null;
      resultado.forEach(doc => {
        const datos = doc.data();
        if (datos.contraseña === claveInput.value || datos.contrasena === claveInput.value) {
          usuarioEncontrado = datos;
        }
      });

      // Si la contraseña no coincidió, muestra mensaje de error
      if (!usuarioEncontrado) {
        return ponerMensaje("Contraseña incorrecta.", "red");
      }

      // Si eligió entrar como tutor, solicita la clave de autorización adicional
      if (tipoUsuario === "tutor") {
        ponerMensaje("Falta contraseña de tutor.", "#0645ad");
        pedirClaveTutor(usuarioEncontrado);
      } else {
        // Si es estudiante, guarda sus datos en sessionStorage y entra a la pantalla principal
        usuarioEncontrado.tipoUsuario = "estudiante";
        sessionStorage.setItem("usuarioUV", JSON.stringify(usuarioEncontrado));
        ponerMensaje("¡Bienvenido! Entrando...", "green");
        setTimeout(() => {
          window.location.href = "../perspectiva del estudiante/pantalla_principal.html";
        }, 500);
      }
    } catch (error) {
      console.log(error);
      ponerMensaje("Error al conectar con Firebase.", "red");
    }
  };
</script>
</body>
</html>
