<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats | Comunidad UV</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden;background:#edf5ff;color:#12295a}
.pantalla{position:relative;width:100vw;height:100vh;min-width:900px;min-height:560px;overflow:hidden;background:url("../imagenes/tutorados/chats_tutor.png?v=2") center/100% 100% no-repeat}
.zona{position:absolute;z-index:10;border:0;background:transparent;padding:0;cursor:pointer}
.zona:focus-visible{outline:2px solid #0877ee;outline-offset:2px;border-radius:8px}

/* Botones de navegación lateral y barra superior sobre el fondo del diseño */
.nav-inicio{left:.4%;top:15.7%;width:10.2%;height:4.8%;border-radius:8px}
.nav-calendario{left:.4%;top:21.8%;width:10.2%;height:4.8%;border-radius:8px}
.nav-chats{left:.4%;top:28.2%;width:10.2%;height:4.8%;border-radius:8px}
.nav-perfil{left:.4%;top:34.4%;width:10.2%;height:4.8%;border-radius:8px}
.nav-config{left:.4%;top:40.8%;width:10.2%;height:4.8%;border-radius:8px}
.volver{left:13.2%;top:7.0%;width:18%;height:4.8%;border-radius:8px}
.notificaciones{left:85.4%;top:.4%;width:3.0%;height:5.2%;border-radius:8px}
.menu-usuario{left:92.8%;top:.3%;width:6.4%;height:5.4%;border-radius:8px}
.icono-perfil-link{left:89.6%;top:.4%;width:2.9%;height:5.2%;z-index:20;border-radius:50%}
.zona:hover{background:rgba(20,120,230,.08)}

/* Buscador y lista dinámica de conversaciones alineados exactamente con las cajas de chats_tutor.png (1920x1080) */
#buscarChat{position:absolute;z-index:12;left:17.2%;top:25.8%;width:21.3%;height:6.7%;padding:0 12px;border:0;outline:none;background:transparent;color:#17315e;font:clamp(12px,1.05vw,18px) Arial,sans-serif}
#buscarChat::placeholder{color:#536078;opacity:1}
#buscarChat:focus{background:rgba(255,255,255,.25);border-radius:10px;box-shadow:0 0 0 2px rgba(91,148,217,.45)}
.lista-chats{position:absolute;z-index:11;left:13.8%;top:34.0%;width:25.2%;height:61.5%;overflow:auto;padding:4px 5px 12px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:#b7cce6 transparent}
.chat-item{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:75px;padding:9px 8px;border:0;border-bottom:1px solid rgba(169,190,218,.55);border-radius:9px;background:rgba(255,255,255,.32);color:#142c5b;text-align:left;cursor:pointer}
.chat-item:hover{background:rgba(218,235,255,.62)}
.chat-item.active{background:rgba(197,222,252,.72);box-shadow:inset 3px 0 #1677dc}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:#c8def8;color:#123b73;font-size:15px;font-weight:bold}
.chat-detalle{min-width:0;display:flex;flex-direction:column;gap:5px}
.chat-nombre{font-size:clamp(12px,.95vw,16px);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-preview{font-size:clamp(10px,.82vw,14px);color:#263d66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-hora{align-self:start;padding-top:5px;font-size:clamp(10px,.78vw,13px);color:#607391;white-space:nowrap}
.lista-estado{padding:16px 9px;color:#6f809b;font-size:clamp(11px,.82vw,14px);line-height:1.45}
.chat-candidato{margin:8px 4px;padding:12px;border:1px solid #b9d2ef;border-radius:11px;background:rgba(240,247,255,.96);color:#17345e;cursor:pointer;text-align:left;font-size:13px}
.chat-candidato strong{display:block;margin-bottom:4px}
.chat-candidato:hover{background:#e4f1ff}

/* Encabezado y mensajes */
.encabezado-chat[hidden]{display:none!important}
.encabezado-chat{position:absolute;z-index:11;left:43.2%;top:23.8%;width:48.6%;height:7.6%;display:flex;align-items:center;gap:14px;padding:0 10px;border-bottom:1px solid rgba(185,206,232,.65);pointer-events:none}
.avatar-grande{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#c8def8;color:#123b73;font-weight:bold;font-size:17px;flex:none}
.datos-contacto{min-width:0;display:flex;flex-direction:column;gap:3px}
.datos-contacto strong{font-size:clamp(14px,1.2vw,20px);color:#102a5b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datos-contacto small{font-size:clamp(11px,.9vw,15px);color:#243c68}
.mensajes{position:absolute;z-index:11;left:43.2%;top:31.8%;width:48.6%;height:51.8%;overflow-y:auto;display:flex;flex-direction:column;gap:13px;padding:12px 10px;scrollbar-width:thin;scrollbar-color:#b7cce6 transparent}
.vacio-chat{margin:auto;text-align:center;color:#8392a9;font-size:14px;line-height:1.5;max-width:330px}
.burbuja{max-width:78%;align-self:flex-start;padding:12px 15px;border-radius:17px 17px 17px 5px;background:rgba(224,235,249,.96);color:#102955;font-size:clamp(12px,.98vw,17px);line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(27,68,115,.04)}
.burbuja.mia{align-self:flex-end;background:#1769c5;color:#fff;border-radius:17px 17px 5px 17px}
.burbuja small{display:block;margin-top:5px;text-align:right;font-size:10px;color:#71829d}
.burbuja.mia small{color:#dcecff}
.adjunto-mensaje{display:block;margin-top:6px;color:inherit;text-decoration:underline;font-size:12px;overflow-wrap:anywhere}

/* Campo para escribir: controles transparentes colocados exactamente sobre la barra inferior del diseño */
#botonAdjuntar{position:absolute;z-index:14;left:43.4%;top:86.4%;width:3.3%;height:7.1%;border:0;border-radius:12px;background:transparent;cursor:pointer}
#archivoChat{display:none}
#textoChat{position:absolute;z-index:13;left:47.35%;top:86.50%;width:39.55%;height:6.90%;padding:0 16px;border:0;outline:none;border-radius:25px;background:transparent;color:#18345f;font:clamp(12px,1.05vw,17px) Arial,sans-serif}
#textoChat::placeholder{color:#596477;opacity:1}
#textoChat:focus{box-shadow:inset 0 0 0 2px rgba(88,143,211,.38)}
#botonEnviar{position:absolute;z-index:14;left:88.02%;top:86.39%;width:4.32%;height:7.04%;border:0;border-radius:50%;background:transparent;cursor:pointer}
#botonEnviar:disabled,#botonAdjuntar:disabled{cursor:not-allowed;opacity:.4}
.archivo-pendiente{position:absolute;z-index:15;left:47.35%;top:82.8%;max-width:39%;padding:4px 9px;border-radius:7px;background:#fff;color:#31557f;font-size:11px;display:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.archivo-pendiente.visible{display:block}

.menu-perfil{position:absolute;z-index:30;right:1.1%;top:6.4%;width:210px;padding:13px;border:1px solid #dce8f6;border-radius:12px;background:#fff;box-shadow:0 8px 25px #0002;display:none;font-size:12px;color:#17345e}
.menu-perfil.visible{display:block}
.menu-perfil strong{display:block;margin-bottom:7px;overflow-wrap:anywhere}
.menu-perfil button{width:100%;border:0;border-radius:7px;background:#fff0f0;color:#b42318;font-weight:700;text-align:left;padding:9px;cursor:pointer}
.mensaje-sistema{position:fixed;z-index:50;bottom:18px;left:50%;transform:translateX(-50%);display:none;max-width:90%;background:#073967;color:white;padding:12px 17px;border-radius:9px;font-size:13px;box-shadow:0 5px 18px #0002}
.mensaje-sistema.visible{display:block}
@media(max-width:1050px){.chat-item{grid-template-columns:36px minmax(0,1fr) auto;gap:7px;min-height:64px;padding:6px}.avatar{width:35px;height:35px}.avatar-grande{width:42px;height:42px}.burbuja{max-width:88%}}

.nombre-sesion{position:absolute;z-index:18;left:92.8%;top:.3%;width:4.3%;height:5.4%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0;border:0;border-radius:0;background:transparent;color:#17345e;text-align:left;line-height:1.1;pointer-events:none;overflow:hidden}
.nombre-sesion strong{display:block;max-width:100%;font-size:clamp(10px,.92vw,14px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nombre-sesion small{display:block;font-size:clamp(9px,.75vw,11px);font-weight:400;color:#64748b;white-space:nowrap}
.badge-notificaciones{position:absolute;z-index:25;left:87.2%;top:.8%;min-width:17px;height:17px;padding:0 4px;border-radius:20px;background:#e53935;color:#fff;font-size:10px;font-weight:bold;display:none;align-items:center;justify-content:center;pointer-events:none}
.badge-notificaciones.visible{display:flex}
.panel-notificaciones{position:absolute;z-index:40;right:8%;top:7.2%;width:min(360px,32vw);max-height:55vh;overflow:auto;border:1px solid #d8e5f4;border-radius:13px;background:#fff;box-shadow:0 10px 28px #0003;display:none;color:#17345e}
.panel-notificaciones.visible{display:block}
.panel-notificaciones h3{margin:0;padding:13px 15px;border-bottom:1px solid #e5edf7;font-size:14px}
.notificacion-chat{display:block;width:100%;padding:12px 14px;border:0;border-bottom:1px solid #edf2f8;background:#fff;color:#17345e;text-align:left;cursor:pointer}
.notificacion-chat:hover{background:#eef6ff}
.notificacion-chat strong{display:block;margin-bottom:4px;font-size:12px}
.notificacion-chat span{display:block;font-size:11px;color:#607391;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notificacion-vacia{padding:18px;color:#71819a;font-size:12px;text-align:center}
.chat-no-leidos{position:absolute;right:9px;bottom:8px;min-width:18px;height:18px;padding:0 5px;border-radius:20px;background:#0877ee;color:#fff;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center}

</style>
</head>

  <a class="zona nav-inicio" id="navInicio" href="pantalla_principal_tutor.html" aria-label="Inicio" title="Inicio"></a>

  <!-- Accesos laterales de Perfil y Configuración -->
  <a class="zona nav-perfil" id="navPerfil" href="perfil_tutor.html" aria-label="Perfil" title="Perfil"></a>

</main>

<div class="mensaje-sistema" id="mensajeSistema" role="status" aria-live="polite"></div>

<script type="module">
import { db, storage } from "../base%20de%20datos/firebase.js";

import {
  collection,
  addDoc,
  onSnapshot,
  query,
  where,
  serverTimestamp,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

import {
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.10.0/firebase-storage.js";

const $ = id => document.getElementById(id);

function leerSesion() {
  try {
    return JSON.parse(sessionStorage.getItem("usuarioUV") || "null");
  } catch (error) {
    console.error("No se pudo leer usuarioUV:", error);
    return null;
  }
}

const usuario = leerSesion();

if (!usuario) {
  location.replace("../codigo principal/login.html?v=2");
  throw new Error("No existe una sesión activa.");
}

// La matrícula es el identificador único del chat. No se usa el correo como sustituto.
const usuarioId = String(usuario.matricula || "").trim();

if (!usuarioId) {
  alert("Tu sesión no contiene una matrícula. Cierra sesión e inicia nuevamente.");
  location.replace("../codigo principal/login.html?v=2");
  throw new Error("La sesión no contiene matrícula.");
}

const nombreUsuario = String(
  usuario.nombre ||
  usuario.nombreCompleto ||
  usuario.nombres ||
  usuario.correo ||
  "Usuario UV"
).trim();

const tipoUsuarioRaw = String(
  usuario.tipoUsuario || usuario.rol || "estudiante"
).trim().toLowerCase();

const rolUsuario =
  tipoUsuarioRaw.includes("tutor") ||
  tipoUsuarioRaw.includes("docente")
    ? "tutor"
    : "estudiante";

const etiquetaRol = rolUsuario === "tutor" ? "Tutor" : "Estudiante";
const mensajesRef = collection(db, "mensajesTutor");

// Cada conversación tiene el mismo ID desde los dos extremos: matrículas ordenadas alfabéticamente.
function crearIdConversacion(idContacto) {
  return [
    usuarioId,
    String(idContacto).trim()
  ].sort((a, b) => a.localeCompare(b)).join("__");
}

let mensajes = [];
let mensajesEnviados = [];
let mensajesRecibidos = [];
let conversaciones = new Map();
let conversacionActiva = null;
let contactoActivo = null;
let usuarioBuscado = null;
let temporizadorBusqueda = null;
let temporizadorAviso = null;
let detenerEnviados = null;
let detenerRecibidos = null;
let enviando = false;

function mostrarAviso(texto) {
  const el = $("mensajeSistema");
  el.textContent = texto;
  el.classList.add("visible");

  clearTimeout(temporizadorAviso);

  temporizadorAviso = setTimeout(() => {
    el.classList.remove("visible");
  }, 4200);
}

function tiempoMs(valor) {
  if (valor?.toMillis) return valor.toMillis();
  if (valor?.toDate) return valor.toDate().getTime();
  if (valor instanceof Date) return valor.getTime();
  return 0;
}

function mostrarFecha(valor) {
  const ms = tiempoMs(valor);

  if (!ms) return "";

  const fecha = new Date(ms);
  const hoy = new Date();
  const ayer = new Date();

  ayer.setDate(hoy.getDate() - 1);

  if (fecha.toDateString() === hoy.toDateString()) {
    return fecha.toLocaleTimeString("es-MX", {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  if (fecha.toDateString() === ayer.toDateString()) {
    return "Ayer";
  }

  return fecha.toLocaleDateString("es-MX", {
    day: "2-digit",
    month: "short"
  });
}

function mostrarHoraMensaje(valor) {
  const ms = tiempoMs(valor);

  return ms
    ? new Date(ms).toLocaleTimeString("es-MX", {
        hour: "2-digit",
        minute: "2-digit"
      })
    : "Enviando...";
}

function iniciales(nombre) {
  const letras = String(nombre || "UV")
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(p => p[0] || "")
    .join("")
    .toUpperCase();

  return letras || "UV";
}

function obtenerOtroParticipante(m) {
  const emisor = String(m.emisorId || "");
  const destinatario = String(m.destinatarioId || "");

  if (emisor && emisor !== usuarioId) return emisor;
  if (destinatario && destinatario !== usuarioId) return destinatario;

  if (m.conversacion) {
    return String(m.conversacion)
      .split("__")
      .find(id => id && id !== usuarioId) || "";
  }

  return "";
}

function nombreDeOtro(m, idOtro) {
  if (String(m.emisorId || "") !== usuarioId && m.emisorNombre) {
    return String(m.emisorNombre);
  }

  if (String(m.destinatarioId || "") !== usuarioId && m.destinatarioNombre) {
    return String(m.destinatarioNombre);
  }

  return String(idOtro || "Usuario UV");
}

function rolDeOtro(m) {
  if (String(m.emisorId || "") !== usuarioId) {
    return m.rolEmisor === "tutor" ? "Tutor" : "Estudiante";
  }

  if (String(m.destinatarioId || "") !== usuarioId) {
    return m.rolDestinatario === "tutor" ? "Tutor" : "Estudiante";
  }

  return "Usuario UV";
}

function obtenerNoLeidos(conversacionId) {
  return mensajesRecibidos.filter(m =>
    m.conversacion === conversacionId &&
    m.leido !== true
  );
}

function textoPreview(m) {
  if (m?.texto) return String(m.texto);

  if (m?.archivoNombre) {
    return "📎 " + String(m.archivoNombre);
  }

  return "Conversación iniciada";
}

/* RECONSTRUIR CONVERSACIONES */
function reconstruirConversaciones() {
  conversaciones = new Map();

  const ordenados = [...mensajes].sort(
    (a, b) => tiempoMs(a.fecha) - tiempoMs(b.fecha)
  );

  for (const m of ordenados) {
    const idOtro = obtenerOtroParticipante(m);

    if (!idOtro) continue;

    const clave = m.conversacion || crearIdConversacion(idOtro);

    const actual = conversaciones.get(clave) || {
      id: clave,
      contactoId: idOtro,
      nombre: nombreDeOtro(m, idOtro),
      rol: rolDeOtro(m),
      ultimoMensaje: m
    };

    actual.contactoId = idOtro;

    const nombre = nombreDeOtro(m, idOtro);

    if (nombre && nombre !== idOtro) {
      actual.nombre = nombre;
    }

    actual.rol = rolDeOtro(m) || actual.rol;
    actual.ultimoMensaje = m;

    conversaciones.set(clave, actual);
  }

  renderizarLista();
  renderizarMensajes();
  renderizarNotificaciones();
}

/* MOSTRAR LISTA DE CHATS */
function renderizarLista() {
  const lista = $("listaChats");
  lista.replaceChildren();

  const filtro = $("buscarChat").value
    .trim()
    .toLocaleLowerCase("es-MX");

  const opciones = [...conversaciones.values()]
    .filter(c =>
      !filtro ||
      c.nombre.toLocaleLowerCase("es-MX").includes(filtro) ||
      c.contactoId.toLocaleLowerCase("es-MX").includes(filtro)
    )
    .sort((a, b) =>
      tiempoMs(b.ultimoMensaje?.fecha) -
      tiempoMs(a.ultimoMensaje?.fecha)
    );

  if (!opciones.length && !usuarioBuscado) {
    const estado = document.createElement("p");
    estado.className = "lista-estado";

    estado.textContent = filtro
      ? "No hay conversaciones con ese nombre o matrícula. Escribe una matrícula registrada para iniciar una conversación."
      : "Todavía no hay conversaciones. Busca la matrícula de la persona con la que deseas hablar.";

    lista.append(estado);
  }

  for (const c of opciones) {
    const boton = document.createElement("button");
    boton.type = "button";

    boton.className =
      "chat-item" +
      (conversacionActiva === c.id ? " active" : "");

    const avatar = document.createElement("span");
    avatar.className = "avatar";
    avatar.textContent = iniciales(c.nombre);

    const detalle = document.createElement("span");
    detalle.className = "chat-detalle";

    const nombre = document.createElement("span");
    nombre.className = "chat-nombre";
    nombre.textContent = c.nombre;

    const preview = document.createElement("span");
    preview.className = "chat-preview";
    preview.textContent = textoPreview(c.ultimoMensaje);

    const hora = document.createElement("span");
    hora.className = "chat-hora";
    hora.textContent = mostrarFecha(c.ultimoMensaje?.fecha);

    detalle.append(nombre, preview);
    boton.append(avatar, detalle, hora);

    const noLeidos = obtenerNoLeidos(c.id).length;

    if (noLeidos) {
      const contador = document.createElement("span");
      contador.className = "chat-no-leidos";
      contador.textContent = noLeidos > 99 ? "99+" : String(noLeidos);
      boton.append(contador);
    }

    boton.addEventListener("click", () => {
      abrirConversacion(c.contactoId, c.nombre, c.rol);
    });

    lista.append(boton);
  }

  // Únicamente se ofrece iniciar chat cuando se encuentra una matrícula válida.
  if (usuarioBuscado) {
    const clave = crearIdConversacion(usuarioBuscado.id);

    if (!conversaciones.has(clave)) {
      const botonNuevo = document.createElement("button");
      botonNuevo.type = "button";
      botonNuevo.className = "chat-candidato";

      const fuerte = document.createElement("strong");
      fuerte.textContent = "＋ Iniciar conversación";

      const detalle = document.createElement("span");
      detalle.textContent =
        `${usuarioBuscado.nombre} · ${usuarioBuscado.id}`;

      botonNuevo.append(fuerte, detalle);

      botonNuevo.addEventListener("click", () => {
        const contacto = { ...usuarioBuscado };
        usuarioBuscado = null;

        abrirConversacion(
          contacto.id,
          contacto.nombre,
          contacto.rol
        );

        renderizarLista();
      });

      lista.append(botonNuevo);
    }
  }
}

/* MARCAR MENSAJES COMO LEÍDOS */
async function marcarComoLeidos(idConversacion) {
  const pendientes = mensajesRecibidos.filter(m =>
    m.conversacion === idConversacion &&
    m.leido !== true
  );

  if (!pendientes.length) return;

  await Promise.all(
    pendientes.map(m =>
      updateDoc(doc(db, "mensajesTutor", m.id), {
        leido: true,
        fechaLectura: serverTimestamp()
      })
    )
  );
}

/* ABRIR CONVERSACIÓN */
function abrirConversacion(idContacto, nombre, rol = "Usuario UV") {
  if (!idContacto || String(idContacto) === usuarioId) return;

  contactoActivo = {
    id: String(idContacto),
    nombre: String(nombre || idContacto),
    rol: String(rol || "Usuario UV")
  };

  conversacionActiva = crearIdConversacion(contactoActivo.id);

  $("encabezadoChat").hidden = false;
  $("avatarGrande").textContent = iniciales(contactoActivo.nombre);
  $("nombreContacto").textContent = contactoActivo.nombre;

  $("subtituloContacto").textContent =
    `${contactoActivo.rol} · Matrícula ${contactoActivo.id}`;

  $("textoChat").disabled = false;
  $("botonEnviar").disabled = false;
  $("botonAdjuntar").disabled = false;

  renderizarLista();
  renderizarMensajes();

  marcarComoLeidos(conversacionActiva).catch(error => {
    console.error(
      "No se pudieron marcar los mensajes como leídos:",
      error
    );
  });

  $("textoChat").focus();
}

/* CREAR BURBUJA */
function crearBurbuja(m) {
  const mia = String(m.emisorId || "") === usuarioId;

  const burbuja = document.createElement("article");

  burbuja.className =
    "burbuja" + (mia ? " mia" : "");

  if (m.texto) {
    const texto = document.createElement("div");
    texto.textContent = String(m.texto);
    burbuja.append(texto);
  }

  if (m.archivoUrl && m.archivoNombre) {
    const enlace = document.createElement("a");

    enlace.className = "adjunto-mensaje";
    enlace.href = String(m.archivoUrl);
    enlace.target = "_blank";
    enlace.rel = "noopener noreferrer";
    enlace.textContent = "📎 " + String(m.archivoNombre);

    burbuja.append(enlace);
  }

  const hora = document.createElement("small");

  hora.textContent =
    mostrarHoraMensaje(m.fecha) +
    (mia && m.leido === true ? " · Leído" : "");

  burbuja.append(hora);

  return burbuja;
}

/* MOSTRAR MENSAJES */
function renderizarMensajes() {
  const caja = $("mensajes");
  caja.replaceChildren();

  if (!conversacionActiva) {
    const p = document.createElement("p");
    p.className = "vacio-chat";
    p.textContent =
      "Selecciona una conversación o busca una matrícula para comenzar.";

    caja.append(p);
    return;
  }

  const delChat = mensajes
    .filter(m =>
      (
        m.conversacion ||
        (
          m.emisorId && m.destinatarioId
            ? crearIdConversacion(
                m.emisorId === usuarioId
                  ? m.destinatarioId
                  : m.emisorId
              )
            : ""
        )
      ) === conversacionActiva
    )
    .sort((a, b) =>
      tiempoMs(a.fecha) - tiempoMs(b.fecha)
    );

  if (!delChat.length) {
    const p = document.createElement("p");
    p.className = "vacio-chat";
    p.textContent =
      "Esta conversación está lista. Escribe un mensaje para comenzar.";

    caja.append(p);
  } else {
    delChat.forEach(m => caja.append(crearBurbuja(m)));
  }

  caja.scrollTop = caja.scrollHeight;
}

/* NOTIFICACIONES */
function renderizarNotificaciones() {
  const noLeidos = mensajesRecibidos
    .filter(m => m.leido !== true)
    .sort((a, b) =>
      tiempoMs(b.fecha) - tiempoMs(a.fecha)
    );

  const badge = $("badgeNotificaciones");

  badge.textContent =
    noLeidos.length > 99
      ? "99+"
      : String(noLeidos.length);

  badge.classList.toggle(
    "visible",
    noLeidos.length > 0
  );

  const lista = $("listaNotificaciones");
  lista.replaceChildren();

  if (!noLeidos.length) {
    const vacia = document.createElement("div");
    vacia.className = "notificacion-vacia";
    vacia.textContent = "No tienes mensajes nuevos.";

    lista.append(vacia);
    return;
  }

  for (const m of noLeidos.slice(0, 20)) {
    const idOtro = String(m.emisorId || "");

    const boton = document.createElement("button");
    boton.type = "button";
    boton.className = "notificacion-chat";

    const fuerte = document.createElement("strong");
    fuerte.textContent =
      `${m.emisorNombre || idOtro} · ${idOtro}`;

    const detalle = document.createElement("span");
    detalle.textContent = textoPreview(m);

    boton.append(fuerte, detalle);

    boton.addEventListener("click", () => {
      $("panelNotificaciones").classList.remove("visible");

      abrirConversacion(
        idOtro,
        m.emisorNombre || idOtro,
        m.rolEmisor === "tutor" ? "Tutor" : "Estudiante"
      );
    });

    lista.append(boton);
  }
}

/* ACTUALIZAR MENSAJES DESDE FIREBASE */
function actualizarDesdeNube() {
  const mapa = new Map();

  for (const m of [
    ...mensajesEnviados,
    ...mensajesRecibidos
  ]) {
    mapa.set(m.id, m);
  }

  mensajes = [...mapa.values()];

  reconstruirConversaciones();
}

/* ESCUCHAR MENSAJES EN TIEMPO REAL */
function escucharMensajes() {
  const consultaEnviados = query(
    mensajesRef,
    where("emisorId", "==", usuarioId)
  );

  const consultaRecibidos = query(
    mensajesRef,
    where("destinatarioId", "==", usuarioId)
  );

  detenerEnviados = onSnapshot(
    consultaEnviados,
    snapshot => {
      mensajesEnviados = snapshot.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));

      actualizarDesdeNube();
    },
    error => {
      console.error(
        "Error al escuchar mensajes enviados:",
        error
      );

      mostrarAviso(
        "No se pudieron cargar los mensajes enviados. Revisa las reglas de Firestore."
      );
    }
  );

  detenerRecibidos = onSnapshot(
    consultaRecibidos,
    snapshot => {
      mensajesRecibidos = snapshot.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));

      actualizarDesdeNube();

      if (conversacionActiva) {
        marcarComoLeidos(conversacionActiva)
          .catch(error => console.error(error));
      }
    },
    error => {
      console.error(
        "Error al escuchar mensajes recibidos:",
        error
      );

      mostrarAviso(
        "No se pudieron cargar los mensajes recibidos. Revisa las reglas de Firestore."
      );
    }
  );
}

/* BUSCAR MATRÍCULA */
async function buscarMatriculaEnNube(valor) {
  usuarioBuscado = null;

  if (!valor || valor.length < 4 || valor === usuarioId) {
    renderizarLista();
    return;
  }

  try {
    const consulta = query(
      collection(db, "usuarios"),
      where("matricula", "==", valor)
    );

    const resultado = await getDocs(consulta);

    if ($("buscarChat").value.trim() !== valor) return;

    if (resultado.empty) {
      mostrarAviso(
        "No encontramos esa matrícula en la colección usuarios de Firestore."
      );

      renderizarLista();
      return;
    }

    if (resultado.size > 1) {
      mostrarAviso(
        "Hay matrículas duplicadas en la base de datos. Debe existir un solo usuario por matrícula."
      );

      renderizarLista();
      return;
    }

    const datos = resultado.docs[0].data();
    const id = String(datos.matricula || "").trim();

    if (id && id !== usuarioId) {
      const tipo = String(
        datos.tipoUsuario || datos.rol || "estudiante"
      ).toLowerCase();

      usuarioBuscado = {
        id,
        nombre: String(
          datos.nombre ||
          datos.nombreCompleto ||
          datos.nombres ||
          datos.correo ||
          id
        ),
        rol:
          tipo.includes("tutor") ||
          tipo.includes("docente")
            ? "Tutor"
            : "Estudiante"
      };
    }

  } catch (error) {
    console.error("Error al buscar matrícula:", error);

    mostrarAviso(
      "No se pudo consultar la matrícula. Revisa Firestore y sus reglas de lectura."
    );
  }

  renderizarLista();
}

/* EVENTO DEL BUSCADOR */
$("buscarChat").addEventListener("input", () => {
  usuarioBuscado = null;

  renderizarLista();

  clearTimeout(temporizadorBusqueda);

  const valor = $("buscarChat").value.trim();

  if (valor.length >= 4) {
    temporizadorBusqueda = setTimeout(
      () => buscarMatriculaEnNube(valor),
      450
    );
  }
});

/* ENVIAR MENSAJE */
$("formChat").addEventListener("submit", async evento => {
  evento.preventDefault();

  if (!contactoActivo || enviando) return;

  const texto = $("textoChat").value.trim();
  const archivo = $("archivoChat").files?.[0] || null;

  if (!texto && !archivo) return;

  if (archivo && archivo.size > 10 * 1024 * 1024) {
    mostrarAviso("El archivo supera el límite de 10 MB.");
    return;
  }

  enviando = true;
  $("botonEnviar").disabled = true;

  const textoAnterior = texto;

  try {
    let archivoInfo = {};

    if (archivo) {
      const nombreSeguro = archivo.name.replace(
        /[^\w.() -]/g,
        "_"
      );

      const ruta =
        `chats/${conversacionActiva}/${Date.now()}_${nombreSeguro}`;

      const referencia = ref(storage, ruta);

      await uploadBytes(
        referencia,
        archivo,
        {
          contentType:
            archivo.type || "application/octet-stream"
        }
      );

      const url = await getDownloadURL(referencia);

      archivoInfo = {
        archivoUrl: url,
        archivoNombre: archivo.name,
        archivoTipo:
          archivo.type || "application/octet-stream",
        archivoRuta: ruta
      };
    }

    await addDoc(mensajesRef, {
      conversacion: conversacionActiva,

      emisorId: usuarioId,
      emisorNombre: nombreUsuario,

      destinatarioId: contactoActivo.id,
      destinatarioNombre: contactoActivo.nombre,

      rolEmisor: rolUsuario,

      rolDestinatario:
        contactoActivo.rol.toLowerCase().includes("tutor")
          ? "tutor"
          : "estudiante",

      texto,

      leido: false,

      ...archivoInfo,

      fecha: serverTimestamp()
    });

    $("textoChat").value = "";
    $("archivoChat").value = "";

    $("archivoPendiente").textContent = "";
    $("archivoPendiente").classList.remove("visible");

  } catch (error) {
    console.error("Error al enviar mensaje:", error);

    mostrarAviso(
      "No se pudo enviar. Revisa la conexión y las reglas de Firestore/Storage."
    );

    $("textoChat").value = textoAnterior;

  } finally {
    enviando = false;
    $("botonEnviar").disabled = !contactoActivo;
  }
});

/* ADJUNTAR ARCHIVOS */
$("botonAdjuntar").addEventListener("click", () => {
  $("archivoChat").click();
});

$("archivoChat").addEventListener("change", () => {
  const archivo = $("archivoChat").files?.[0];
  const etiqueta = $("archivoPendiente");

  if (!archivo) {
    etiqueta.textContent = "";
    etiqueta.classList.remove("visible");
    return;
  }

  if (archivo.size > 10 * 1024 * 1024) {
    $("archivoChat").value = "";

    mostrarAviso("El archivo supera el límite de 10 MB.");
    return;
  }

  etiqueta.textContent = "Adjunto: " + archivo.name;
  etiqueta.classList.add("visible");
});

/* BOTONES DE LA INTERFAZ (Notificaciones, Menú de usuario y Cerrar sesión) */
$("notificaciones").addEventListener("click", evento => {
  evento.stopPropagation();
  $("menuPerfil").classList.remove("visible");
  $("panelNotificaciones").classList.toggle("visible");
});

$("menuUsuario").addEventListener("click", evento => {
  evento.stopPropagation();
  $("panelNotificaciones").classList.remove("visible");
  $("menuPerfil").classList.toggle("visible");
});

$("cerrarSesion").addEventListener("click", () => {
  if (detenerEnviados) detenerEnviados();
  if (detenerRecibidos) detenerRecibidos();

  sessionStorage.removeItem("usuarioUV");
  sessionStorage.removeItem("perfilSeleccionadoUV");
  sessionStorage.removeItem("tipoUsuario");
  sessionStorage.removeItem("chatPendienteUV");

  location.href = "../codigo principal/login.html?v=2";
});

/* NAVEGACIÓN SEGÚN EL ROL (actualiza enlaces del menú lateral) */
if (rolUsuario === "tutor") {
  $("navInicio").href = "pantalla_principal_tutor.html";
  $("navCalendario").href = "calendario_tutor.html";
  $("navChats").href = "chats_tutor.html";

  $("navChats").setAttribute("aria-current", "page");
} else {
  $("navInicio").href = "../perspectiva del estudiante/pantalla_principal.html";
  $("navCalendario").href = "../perspectiva del estudiante/calendario_estudiante.html";
  $("navChats").href = "../perspectiva del estudiante/chats_estudiantes.html";

  $("navChats").setAttribute("aria-current", "page");
}

/* NOMBRE Y ROL DEL USUARIO */
$("nombreTutor").textContent =
  `${nombreUsuario} · ${etiquetaRol}`;

$("nombreSesionTexto").textContent =
  nombreUsuario.split(/\s+/)[0] || "Tutor";

$("rolSesion").textContent = etiquetaRol;

/* CERRAR MENÚS */
window.addEventListener("keydown", evento => {
  if (evento.key === "Escape") {
    $("menuPerfil").classList.remove("visible");
    $("panelNotificaciones").classList.remove("visible");
  }
});

document.addEventListener("click", evento => {
  if (!evento.target.closest("#panelNotificaciones, #notificaciones")) {
    $("panelNotificaciones").classList.remove("visible");
  }
  if (!evento.target.closest("#menuPerfil, #menuUsuario")) {
    $("menuPerfil").classList.remove("visible");
  }
});

/* INICIAR FIREBASE */
escucharMensajes();

</script>
