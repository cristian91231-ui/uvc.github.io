<style>
/* Configuración general de la página y contenedor con imagen de fondo */
*{box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;}
body{overflow:hidden;background:#f4faff;color:#15245f;}
.pantalla{position:relative;width:100vw;height:100vh;min-width:900px;min-height:560px;overflow:hidden;background:url("../imagenes/tutorados/calendario_tutor.png?v=2") center/100% 100% no-repeat;}

/* Clase base para áreas y botones transparentes sobre los iconos del diseño */
.zona{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer;border-radius:8px;}
.zona:hover{background:rgba(20,120,230,.08);}
.zona:focus-visible{outline:2px solid #0877ee;outline-offset:2px;border-radius:8px;}

/* Botones del menú lateral izquierdo (5 opciones del tutor) */
.nav-inicio{left:.4%;top:15.7%;width:10.2%;height:4.8%;}
.nav-calendario{left:.4%;top:21.8%;width:10.2%;height:4.8%;}
.nav-chats{left:.4%;top:28.2%;width:10.2%;height:4.8%;}
.nav-perfil{left:.4%;top:34.4%;width:10.2%;height:4.8%;}
.nav-config{left:.4%;top:40.8%;width:10.2%;height:4.8%;}

/* Botón para volver al inicio y botón azul para crear un nuevo evento */
.volver{left:13.1%;top:7.4%;width:18%;height:5.5%;display:block;background:transparent;border:0;padding:0;cursor:pointer;pointer-events:auto;}
#crearEvento{position:absolute;z-index:20;left:83.8%;top:15%;width:14%;height:6.5%;border:0;border-radius:11px;background:#0877ee;color:#fff;font-weight:bold;font-size:clamp(12px,1.05vw,17px);box-shadow:0 4px 12px #0877ee30;cursor:pointer;pointer-events:auto;}
#crearEvento:hover{background:#0565d0;}

/* Botones de navegación entre meses (transparentes sobre las flechas < y > del fondo) */
#mesAnterior,#mesSiguiente{position:absolute;z-index:8;top:29.2%;width:4.1%;height:5.5%;border:0;border-radius:12px;background:transparent;color:transparent;font-size:0;cursor:pointer;}
#mesAnterior{left:28.8%;}#mesSiguiente{left:49.8%;}
#mesAnterior:hover,#mesSiguiente:hover{background:rgba(197,222,250,.28);}
#mesAnio{position:absolute;z-index:7;left:35%;top:29.6%;width:12.5%;height:4.5%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(15px,1.35vw,22px);font-weight:bold;white-space:nowrap;}

/* Días de la semana y cuadrícula mensual del calendario */
.dias-semana{position:absolute;z-index:7;left:14.68%;top:36.75%;width:54.07%;height:5.25%;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;}
.dias-semana span{text-align:center;font-weight:bold;font-size:clamp(11px,.9vw,15px);}
.rejilla{position:absolute;z-index:7;left:14.68%;top:42%;width:54.07%;height:45.1%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));}
.dia{position:relative;min-width:0;min-height:0;border:0;background:transparent;text-align:left;padding:6px 7px;color:#29385f;font-size:clamp(11px,.95vw,16px);cursor:pointer;}
.dia:hover{background:rgba(200,226,255,.28);}
.dia.seleccionado{outline:2px solid #0877ee;outline-offset:-2px;border-radius:9px;background:rgba(194,222,255,.28);color:#0877ee;font-weight:bold;}
.dia.hoy:not(.seleccionado) .numero{background:#0877ee;color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;}
.dia.es-festivo:not(.seleccionado){background:rgba(229,57,53,.06);border-radius:8px;}
.dia.es-festivo:not(.hoy):not(.seleccionado) .numero{color:#c62828;font-weight:bold;}
.dia.es-vacaciones:not(.seleccionado):not(.es-festivo){background:rgba(245,158,11,.07);border-radius:8px;}
.dia.vacio{cursor:default;}
.etiqueta-dia-uv{position:absolute;top:5px;right:5px;max-width:calc(100% - 34px);padding:1px 4px;border-radius:4px;font-size:8.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
.puntos{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0 0 2px;}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.dia .cantidad-eventos{position:absolute;right:6px;bottom:5px;color:#647b9c;font-size:9px;}
.leyenda-uv{position:absolute;z-index:7;left:14.68%;top:88.2%;width:54.07%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.86);border:1px solid #dde8f6;font-size:clamp(9.5px,.75vw,12px);color:#29436a;}
.leyenda-item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:600;}
.leyenda-punto{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.proximos{position:absolute;z-index:7;left:73.5%;top:34.5%;width:23.5%;height:55%;overflow-y:auto;padding:5px 4px;display:flex;flex-direction:column;gap:10px;}
.encabezado-proximos{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:9px;background:rgba(225,239,255,.85);color:#143566;font-size:11.5px;font-weight:700;}
.btn-ver-mes{border:0;border-radius:6px;padding:3px 7px;background:#0877ee;color:#fff;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.btn-ver-mes:hover{background:#0560c4;}
.evento{display:grid;grid-template-columns:11px minmax(0,1fr) auto;gap:9px;align-items:start;padding:12px 10px;border:1px solid #e4edf8;border-radius:13px;background:rgba(239,246,255,.88);min-height:65px;cursor:pointer;}

<script type="module">
import { db } from "../base%20de%20datos/firebase.js";
import { collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const COLORES = {
  "Pensamiento Crítico": "#8558ef",
  "Metodología de la Programación": "#2494f4",
  "Lógica": "#35bb45",
  "Álgebra Lineal": "#bd75e8",
  "Fundamento de la Ingeniería de Software": "#f28aa5",
  "Fundamentos de Ingeniería de Sistemas": "#f28aa5",
  "Literacidad Digital": "#e9ad36",
  "Todas las materias": "#2494f4",
  "Día festivo / Suspensión de labores": "#e53935",
  "Calendario oficial UV": "#008a3b",
  "Evaluaciones / Exámenes UV": "#0d8abc",
  "Periodo vacacional UV": "#f59e0b",
  "Trámites escolares UV": "#6366f1"
};

function obtenerUsuario() {
  try { return JSON.parse(sessionStorage.getItem("usuarioUV") || "null"); } catch { return null; }
}

const usuario = obtenerUsuario() || {};
const tutorId = String(usuario.matricula || usuario.correo || usuario.email || "tutor-demo").trim();
const nombreTutorOrigen = String(usuario.nombre || usuario.nombreCompleto || usuario.nombres || usuario.correo || "").trim();
const eventosRef = collection(db, "eventosCalendario");

let eventosTutor = [], eventos = [], fechaVista = new Date(), fechaSeleccionada = fechaLocal(new Date()), filtroDiaActivo = false, eventoEditando = null, temporizadorMensaje;
let notificacionesSistema = [], mensajesRecibidos = [];
const cacheOficialesUV = new Map();

function fechaLocal(fecha) {
  return `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, "0")}-${String(fecha.getDate()).padStart(2, "0")}`;
}

function fechaAObjeto(valor) {
  const [y, m, d] = String(valor).split("-").map(Number);
  return new Date(y, m - 1, d);
}

// --- Generador de fechas del Calendario Oficial de la Universidad Veracruzana (UV) ---
function nEsimoDiaSemana(anio, mesIdx, diaSemana, n) {
  const primero = new Date(anio, mesIdx, 1);
  const offset = (diaSemana - primero.getDay() + 7) % 7;
  return 1 + offset + (n - 1) * 7;
}

function calcularDomingoPascua(anio) {
  const a = anio % 19;
  const b = Math.floor(anio / 100);
  const c = anio % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31) - 1;
  const dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(anio, mes, dia);
}

function sumarDias(fechaBase, dias) {
  const d = new Date(fechaBase.getFullYear(), fechaBase.getMonth(), fechaBase.getDate() + dias);
  return fechaLocal(d);
}

function fmtFecha(anio, mes, dia) {
  return `${anio}-${String(mes).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;
}

function obtenerEventosOficialesUVPorAnio(anio) {
  if (cacheOficialesUV.has(anio)) return cacheOficialesUV.get(anio);

  const lunesConstitucion = nEsimoDiaSemana(anio, 1, 1, 1);
  const lunesInicioFebJul = nEsimoDiaSemana(anio, 1, 1, 2);
  const lunesBenitoJuarez = nEsimoDiaSemana(anio, 2, 1, 3);
  const miercolesFinFebJul = nEsimoDiaSemana(anio, 5, 3, 1);
  const lunesOrdJunio = nEsimoDiaSemana(anio, 5, 1, 2);
  const lunesInicioAgoEne = nEsimoDiaSemana(anio, 7, 1, 3);
  const lunesRevolucion = nEsimoDiaSemana(anio, 10, 1, 3);
  const viernesFinAgoEne = nEsimoDiaSemana(anio, 11, 5, 1);
  const lunesOrdDiciembre = nEsimoDiaSemana(anio, 11, 1, 2);

  const pascua = calcularDomingoPascua(anio);
  const inicioSemanaSanta = sumarDias(pascua, -6);
  const juevesSanto = sumarDias(pascua, -3);
  const viernesSanto = sumarDias(pascua, -2);
  const finSemanaSanta = sumarDias(pascua, 5);
  const regresoSemanaSanta = sumarDias(pascua, 8);

  const lista = [
    // ENERO
    {

function actualizarEventosCombinados() {
  const anioBase = fechaVista.getFullYear();
  const oficiales = [
    ...obtenerEventosOficialesUVPorAnio(anioBase - 1),
    ...obtenerEventosOficialesUVPorAnio(anioBase),
    ...obtenerEventosOficialesUVPorAnio(anioBase + 1)
  ];
  eventos = [...oficiales, ...eventosTutor];
}

function mostrarMensaje(texto) {
  const el = $("mensaje");
  el.textContent = texto;
  el.classList.add("visible");
  clearTimeout(temporizadorMensaje);
  temporizadorMensaje = setTimeout(() => el.classList.remove("visible"), 3500);
}

const colorDe = evento => COLORES[evento.materia] || "#2494f4";
const fechaBonita = valor => fechaAObjeto(valor).toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
const ordenar = lista => [...lista].sort((a, b) => (a.fecha || "").localeCompare(b.fecha || "") || (a.hora || "").localeCompare(b.hora || "") || (a.titulo || "").localeCompare(b.titulo || ""));

function pintarPerfilTutor(nombre) {
  const limpio = String(nombre || "").trim();
  const primerNombre = limpio && limpio.toLowerCase() !== "null" ? limpio.split(/\s+/)[0] : "Tutor";
  $("nombreTutor").textContent = primerNombre;
  $("nombreTutorMenu").textContent = primerNombre;
  $("rolTutor").textContent = "Tutor";
  $("rolTutorMenu").textContent = "Tutor";
}

pintarPerfilTutor(nombreTutorOrigen);

function conectarPerfilTutor() {
  const usuariosRef = collection(db, "usuarios");
  let consultaPerfil = null;
  if (usuario.matricula) consultaPerfil = query(usuariosRef, where("matricula", "==", String(usuario.matricula).trim()));
  else if (usuario.correo) consultaPerfil = query(usuariosRef, where("correo", "==", String(usuario.correo).trim()));
  else if (usuario.email) consultaPerfil = query(usuariosRef, where("email", "==", String(usuario.email).trim()));
  if (!consultaPerfil) return;

  onSnapshot(consultaPerfil, snapshot => {
    if (snapshot.empty) return pintarPerfilTutor(nombreTutorOrigen);
    const d = snapshot.docs[0].data();
    const nombreNube = d.nombre || d.nombreCompleto || d.nombres || d.nombrePerfil || d.correo || d.email || nombreTutorOrigen;
    pintarPerfilTutor(nombreNube);
    try { sessionStorage.setItem("usuarioUV", JSON.stringify({ ...usuario, nombre: String(nombreNube).trim() })); } catch {}
  }, () => pintarPerfilTutor(nombreTutorOrigen));
}

function renderizarCalendario() {
  actualizarEventosCombinados();

  const anio = fechaVista.getFullYear(), mes = fechaVista.getMonth();
  $("mesAnio").textContent = `${MESES[mes]} ${anio}`;
  const primerDia = new Date(anio, mes, 1), diasMes = new Date(anio, mes + 1, 0).getDate();
  const desplazamiento = (primerDia.getDay() + 6) % 7;
  const rejilla = $("rejillaCalendario");
  rejilla.replaceChildren();

  for (let i = 0; i < 42; i++) {
    const dia = i - desplazamiento + 1;
    if (dia < 1 || dia > diasMes) {
      const vacio = document.createElement("div");
      vacio.className = "dia vacio";
      rejilla.appendChild(vacio);
      continue;
    }

    const fecha = fechaLocal(new Date(anio, mes, dia));
    const delDia = eventos.filter(e => e.fecha === fecha);
    const tieneFestivo = delDia.some(ev => ev.materia === "Día festivo / Suspensión de labores");
    const tieneVacaciones = delDia.some(ev => ev.materia === "Periodo vacacional UV");

    const celda = document.createElement("button");
    celda.type = "button";
    celda.className = "dia";
    if (fecha === fechaSeleccionada) celda.classList.add("seleccionado");
    if (fecha === fechaLocal(new Date())) celda.classList.add("hoy");
    if (tieneFestivo) celda.classList.add("es-festivo");
    if (tieneVacaciones) celda.classList.add("es-vacaciones");
    celda.setAttribute("aria-label", `Seleccionar ${fechaBonita(fecha)}`);
    celda.setAttribute("aria-pressed", String(fecha === fechaSeleccionada));

    const numero = document.createElement("span");
    numero.className = "numero";
    numero.textContent = dia;
    celda.appendChild(numero);

    if (delDia.length) {
      celda.title = delDia.map(ev => `• ${ev.titulo}`).join("\n");

      const oficialDestacado = delDia.find(ev => ev.esOficialUV);
      if (oficialDestacado) {
        const c = colorDe(oficialDestacado);
        const etiqueta = document.createElement("span");
        etiqueta.className = "etiqueta-dia-uv";
        etiqueta.textContent = oficialDestacado.etiquetaCorta || "UV";
        etiqueta.style.background = `${c}1f`;
        etiqueta.style.color = c;
        celda.appendChild(etiqueta);
      }

      const puntos = document.createElement("div");
      puntos.className = "puntos";
      delDia.slice(0, 4).forEach(evento => {
        const punto = document.createElement("i");
        punto.className = "punto";
        punto.style.background = colorDe(evento);
        punto.title = evento.titulo;
        puntos.appendChild(punto);
      });
      celda.appendChild(puntos);

      if (delDia.length > 4) {
        const cant = document.createElement("span");
        cant.className = "cantidad-eventos";
        cant.textContent = `+${delDia.length - 4}`;
        celda.appendChild(cant);
      }
    }

    celda.onclick = () => {
      if (fechaSeleccionada === fecha && filtroDiaActivo) {
        filtroDiaActivo = false;
      } else {
        fechaSeleccionada = fecha;
        filtroDiaActivo = true;
      }
      renderizarCalendario();
      renderizarEventos();
    };
    celda.ondblclick = () => abrirFormulario(null, fecha);
    rejilla.appendChild(celda);
  }
}

function renderizarEventos() {
  actualizarEventosCombinados();

  const contenedor = $("listaEventos");
  contenedor.replaceChildren();

  const hoyObj = new Date();
  const hoy = fechaLocal(hoyObj);
  const anioVista = fechaVista.getFullYear();
  const mesVista = fechaVista.getMonth();
  const prefijoMes = `${anioVista}-${String(mesVista + 1).padStart(2, "0")}-`;
  const esMesActual = anioVista === hoyObj.getFullYear() && mesVista === hoyObj.getMonth();

  let lista = [];
  let tituloSeccion = "";

  if (filtroDiaActivo) {
    const delDia = ordenar(eventos.filter(ev => ev.fecha === fechaSeleccionada));
    if (delDia.length) {
      lista = delDia;
      tituloSeccion = `Eventos del ${fechaAObjeto(fechaSeleccionada).toLocaleDateString("es-MX", { day: "numeric", month: "short" })}`;
    } else {
      lista = ordenar(eventos.filter(ev => (ev.fecha || "").startsWith(prefijoMes)));
      tituloSeccion = `Sin eventos el día ${fechaAObjeto(fechaSeleccionada).getDate()} · ${MESES[mesVista]}`;
    }
  } else if (esMesActual) {
    const proximos = ordenar(eventos.filter(ev => ev.fecha >= hoy)).slice(0, 14);
    lista = proximos.length ? proximos : ordenar(eventos.filter(ev => (ev.fecha || "").startsWith(prefijoMes)));
    tituloSeccion = `Próximas fechas y eventos UV`;
  } else {
    lista = ordenar(eventos.filter(ev => (ev.fecha || "").startsWith(prefijoMes)));
    tituloSeccion = `Calendario UV · ${MESES[mesVista]} ${anioVista}`;
  }

  const encabezado = document.createElement("div");
  encabezado.className = "encabezado-proximos";
  const spanTitulo = document.createElement("span");
  spanTitulo.textContent = tituloSeccion;
  encabezado.appendChild(spanTitulo);

  if (filtroDiaActivo) {
    const btnMes = document.createElement("button");
    btnMes.type = "button";
    btnMes.className = "btn-ver-mes";
    btnMes.textContent = "Ver mes";
    btnMes.onclick = () => {
      filtroDiaActivo = false;
      renderizarEventos();
    };
    encabezado.appendChild(btnMes);
  }
  contenedor.appendChild(encabezado);

  if (!lista.length) {
    const vacio = document.createElement("p");
    vacio.className = "sin-eventos";
    vacio.textContent = `No hay eventos registrados para ${MESES[mesVista]} ${anioVista}.`;
    contenedor.appendChild(vacio);
    return;
  }

  lista.forEach(evento => {
    const c = colorDe(evento);
    const fila = document.createElement("article");
    fila.className = "evento";

    const color = document.createElement("i");
    color.className = "evento-color";
    color.style.background = c;

    const info = document.createElement("div");
    info.className = "evento-info";

    const titulo = document.createElement("div");
    titulo.className = "evento-titulo";
    titulo.textContent = evento.titulo;

    const fecha = document.createElement("div");
    fecha.className = "evento-fecha";
    fecha.textContent = `${fechaBonita(evento.fecha)}${evento.hora ? " · " + evento.hora : ""}`;

    const materia = document.createElement("div");
    materia.className = "evento-materia";
    materia.textContent = evento.materia || "Todas las materias";
    materia.style.background = `${c}1a`;
    materia.style.color = c;
    info.append(titulo, fecha, materia);

    if (evento.descripcion) {
      const desc = document.createElement("div");
      desc.className = "evento-descripcion";
      desc.textContent = evento.descripcion;
      info.appendChild(desc);
    }

    fila.onclick = () => {
      fechaSeleccionada = evento.fecha;
      filtroDiaActivo = true;
      const obj = fechaAObjeto(evento.fecha);
      fechaVista = new Date(obj.getFullYear(), obj.getMonth(), 1);
      renderizarCalendario();
      renderizarEventos();
    };

    if (evento.esOficialUV) {
      const badgeUV = document.createElement("span");
      badgeUV.className = "badge-oficial-uv";
      badgeUV.textContent = "Oficial UV";
      fila.append(color, info, badgeUV);
    } else {
      const acciones = document.createElement("div");
      acciones.className = "acciones";

      const editar = document.createElement("button");
      editar.type = "button";
      editar.className = "btn-icono";
      editar.title = "Editar evento";
      editar.setAttribute("aria-label", "Editar evento");
      editar.textContent = "✎";
      editar.onclick = e => {
        e.stopPropagation();
        abrirFormulario(evento);
      };

      const borrar = document.createElement("button");
      borrar.type = "button";
      borrar.className = "btn-icono eliminar";
      borrar.title = "Eliminar evento";
      borrar.setAttribute("aria-label", "Eliminar evento");
      borrar.textContent = "×";
      borrar.onclick = e => {
        e.stopPropagation();
        eliminarEvento(evento);
      };

      acciones.append(editar, borrar);
      fila.append(color, info, acciones);
    }

    contenedor.appendChild(fila);
  });
}

function abrirFormulario(evento = null, fecha = fechaSeleccionada) {
  eventoEditando = evento?.id || null;
  $("tituloModal").textContent = evento ? "Editar evento" : "Crear evento";
  $("tituloEvento").value = evento?.titulo || "";
  $("fechaEvento").value = evento?.fecha || fecha;
  $("horaEvento").value = evento?.hora || "";
  $("materiaEvento").value = evento?.materia || "";
  $("descripcionEvento").value = evento?.descripcion || "";
  $("guardarEvento").textContent = evento ? "Guardar cambios" : "Guardar evento";
  $("modalEvento").classList.add("visible");
  $("tituloEvento").focus();
}

function cerrarFormulario() {
  $("modalEvento").classList.remove("visible");
  eventoEditando = null;
}

$("crearEvento").addEventListener("click", () => abrirFormulario(null, fechaSeleccionada));
$("cancelarEvento").addEventListener("click", cerrarFormulario);
$("modalEvento").addEventListener("click", e => { if (e.target === $("modalEvento")) cerrarFormulario(); });

function cambiarMes(diferencia) {
  const diaSeleccionado = fechaAObjeto(fechaSeleccionada).getDate();
  const siguiente = new Date(fechaVista.getFullYear(), fechaVista.getMonth() + diferencia, 1);
  const ultimoDia = new Date(siguiente.getFullYear(), siguiente.getMonth() + 1, 0).getDate();
  fechaVista = siguiente;
  fechaSeleccionada = fechaLocal(new Date(siguiente.getFullYear(), siguiente.getMonth(), Math.min(diaSeleccionado, ultimoDia)));
  filtroDiaActivo = false;
  renderizarCalendario();
  renderizarEventos();
}

$("mesAnterior").addEventListener("click", () => cambiarMes(-1));
$("mesSiguiente").addEventListener("click", () => cambiarMes(1));

$("formEvento").addEventListener("submit", async e => {
  e.preventDefault();
  const boton = $("guardarEvento");
  boton.disabled = true;

  const datos = {
    titulo: $("tituloEvento").value.trim(),
    fecha: $("fechaEvento").value,
    hora: $("horaEvento").value,
    materia: $("materiaEvento").value,
    descripcion: $("descripcionEvento").value.trim(),
    creadoPor: tutorId,
    actualizado: serverTimestamp()
  };

  if (!datos.titulo || !datos.fecha || !datos.materia) {
    mostrarMensaje("Completa el nombre, la fecha y la materia.");
    boton.disabled = false;
    return;
  }

  try {
    if (eventoEditando) {
      const actual = eventosTutor.find(ev => ev.id === eventoEditando);
      if (!actual || actual.creadoPor !== tutorId) throw new Error();
      await updateDoc(doc(db, "eventosCalendario", eventoEditando), datos);
      mostrarMensaje("Evento actualizado correctamente.");
    } else {
      await addDoc(eventosRef, { ...datos, fechaCreacion: serverTimestamp() });
      mostrarMensaje("Evento creado correctamente.");
    }
    fechaSeleccionada = datos.fecha;
    filtroDiaActivo = true;
    fechaVista = fechaAObjeto(datos.fecha);
    cerrarFormulario();
    renderizarCalendario();
    renderizarEventos();
  } catch {
    mostrarMensaje("No se pudo guardar el evento. Revisa la conexión y las reglas de Firestore.");
  } finally {
    boton.disabled = false;
  }
});

async function eliminarEvento(evento) {
  if (evento.esOficialUV) return mostrarMensaje("Las fechas del calendario oficial UV no se pueden eliminar.");
  if (!confirm(`¿Deseas eliminar el evento "${evento.titulo}"?`)) return;
  if (evento.creadoPor !== tutorId) return mostrarMensaje("Este evento no pertenece a esta sesión.");
  try {
    await deleteDoc(doc(db, "eventosCalendario", evento.id));
    mostrarMensaje("Evento eliminado correctamente.");
  } catch {
    mostrarMensaje("No se pudo eliminar el evento. Revisa las reglas de Firestore.");
  }
}

function iniciarCalendario() {
  renderizarCalendario();
  renderizarEventos();
  onSnapshot(query(eventosRef, where("creadoPor", "==", tutorId)), snapshot => {
    eventosTutor = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderizarCalendario();
    renderizarEventos();
  }, () => {
    eventosTutor = [];
    renderizarCalendario();
    renderizarEventos();
  });
}

$("menuFlecha").addEventListener("click", e => {
  e.stopPropagation();
  $("panelNotificaciones").classList.remove("visible");
  $("menuFlecha").setAttribute("aria-expanded", String($("menuUsuarioPanel").classList.toggle("visible")));
});

$("btnNotificaciones").addEventListener("click", e => {
  e.stopPropagation();
  $("menuUsuarioPanel").classList.remove("visible");
  $("menuFlecha").setAttribute("aria-expanded", "false");
  $("panelNotificaciones").classList.toggle("visible");
});

document.addEventListener("click", e => {
  if (!$("menuUsuarioPanel").contains(e.target) && e.target !== $("menuFlecha")) {
    $("menuUsuarioPanel").classList.remove("visible");
    $("menuFlecha").setAttribute("aria-expanded", "false");
  }
  if (!$("panelNotificaciones").contains(e.target) && e.target !== $("btnNotificaciones")) {
    $("panelNotificaciones").classList.remove("visible");
  }
});

// Cierra la sesión actual del tutor y redirige a la pantalla de login
$("cerrarSesion").addEventListener("click", () => {
  sessionStorage.removeItem("usuarioUV");
  sessionStorage.removeItem("perfilSeleccionadoUV");
  sessionStorage.removeItem("tipoUsuario");
  location.href = "../codigo principal/login.html?v=2";
});

function renderizarNotificaciones() {
  const lista = $("listaNotificaciones");
  lista.replaceChildren();
  const total = notificacionesSistema.length + mensajesRecibidos.length;
  $("badgeNotif").style.display = total ? "flex" : "none";
  $("badgeNotif").textContent = total > 99 ? "99+" : String(total);

  if (!total) {
    const vacio = document.createElement("div");
    vacio.className = "notif-vacia";
    vacio.textContent = "Sin notificaciones.";
    lista.appendChild(vacio);
    return;
  }

  const registros = [
    ...mensajesRecibidos.map(m => ({
      tipo: "chat",
      id: m.id,
      fecha: m.fecha,
      titulo: `Mensaje de ${m.emisorNombre || "Estudiante"}`,
      mensaje: m.texto || (m.archivoNombre ? `Adjuntó ${m.archivoNombre}` : "Te envió un mensaje.")
    })),
    ...notificacionesSistema.map(n => ({
      tipo: "sistema",
      id: n.id,
      fecha: n.fecha,
      titulo: n.titulo || "Notificación",
      mensaje: n.mensaje || n.contenido || "Tienes una nueva notificación."
    }))
  ].sort((a, b) => (b.fecha?.toMillis?.() || 0) - (a.fecha?.toMillis?.() || 0));

  registros.slice(0, 30).forEach(notificacion => {
    const fila = document.createElement("div");
    fila.className = "notif-item";
    const avatar = document.createElement("div");
    avatar.className = "notif-avatar";
    avatar.textContent = notificacion.tipo === "chat" ? "✉" : "🔔";
    const texto = document.createElement("div");
    texto.className = "notif-texto";
    const titulo = document.createElement("strong");
    titulo.textContent = notificacion.titulo;
    const mensaje = document.createElement("div");
    mensaje.textContent = notificacion.mensaje;
    texto.append(titulo, mensaje);
    fila.append(avatar, texto);

    if (notificacion.tipo === "chat") {
      fila.style.cursor = "pointer";
      fila.title = "Abrir chats";
      fila.addEventListener("click", () => window.location.href = "chats_tutor.html");
    }
    lista.appendChild(fila);
  });
}

function iniciarNotificaciones() {
  const idNotificaciones = String(usuario.matricula || usuario.correo || usuario.email || tutorId).trim();

  onSnapshot(query(collection(db, "notificaciones"), where("para", "in", [idNotificaciones, "todos", "tutores"])), snapshot => {
    notificacionesSistema = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderizarNotificaciones();
  }, () => {
    notificacionesSistema = [];
    renderizarNotificaciones();
  });

  onSnapshot(query(collection(db, "mensajesTutor"), where("destinatarioId", "==", tutorId)), snapshot => {
    mensajesRecibidos = snapshot.docs.map(d => ({ id: d.id, ...d.data() })).filter(m => String(m.emisorId || "") !== tutorId);
    renderizarNotificaciones();
  }, () => {
    mensajesRecibidos = [];
    renderizarNotificaciones();
  });
}

window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    cerrarFormulario();
    $("menuUsuarioPanel").classList.remove("visible");
    $("menuFlecha").setAttribute("aria-expanded", "false");
    $("panelNotificaciones").classList.remove("visible");
  }
});

iniciarCalendario();
conectarPerfilTutor();
iniciarNotificaciones();
</script>
